services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: amonitoring-crm-backend
    restart: always
    env_file:
      - ./Backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./certs:/app/certs:ro